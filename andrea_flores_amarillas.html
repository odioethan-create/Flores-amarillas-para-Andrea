<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Para Andrea 🌼</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:Georgia,serif;color:#5b4b18;background:linear-gradient(#fffdf0,#fff0a0,#dcefc5)}.scene{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative}.sun{position:absolute;width:260px;height:260px;border-radius:50%;background:#ffd94d55;filter:blur(8px);top:-90px;right:-70px;animation:glow 5s infinite}.card{z-index:2;width:min(92vw,620px);padding:28px 20px 35px;text-align:center;border:1px solid #ffffffbb;border-radius:30px;background:#ffffff77;backdrop-filter:blur(10px);box-shadow:0 20px 60px #74600f2e;animation:card 1.2s both}.garden{height:260px;width:320px;position:relative;margin:auto}.stem{position:absolute;width:5px;height:155px;background:linear-gradient(#659844,#416d32);left:50%;top:95px;border-radius:9px;transform-origin:top;opacity:0;animation:stem .8s forwards}.s1{transform:rotate(-25deg);animation-delay:.5s}.s2{transform:rotate(-9deg);height:165px;animation-delay:.8s}.s3{transform:rotate(11deg);height:160px;animation-delay:1.1s}.s4{transform:rotate(25deg);animation-delay:1.4s}.leaf{position:absolute;width:55px;height:20px;background:#669845;border-radius:100% 0;opacity:0;animation:leaf .7s forwards}.l1{left:75px;top:155px;transform:rotate(20deg);animation-delay:1.2s}.l2{left:205px;top:145px;transform:rotate(160deg);animation-delay:1.4s}.l3{left:110px;top:190px;animation-delay:1.6s}.l4{left:185px;top:195px;transform:rotate(150deg);animation-delay:1.8s}.flower{position:absolute;width:75px;height:105px;top:12px;opacity:0;transform:translateX(-50%) scale(.2);animation:tulip .9s forwards,sway 4s 3s infinite}.f1{left:50%;animation-delay:1.4s,3s}.f2{left:28%;top:45px;animation-delay:1.7s,3.2s}.f3{left:72%;top:43px;animation-delay:2s,3.4s}.f4{left:40%;top:5px;animation-delay:2.3s,3.6s}.tulip{position:absolute;left:8px;top:2px;width:60px;height:60px;background:linear-gradient(135deg,#fff05c,#e5ad00);clip-path:polygon(0 5%,22% 28%,32% 0,50% 25%,69% 0,78% 28%,100% 5%,94% 66%,78% 90%,50% 100%,22% 90%,6% 66%)}.stemflower{position:absolute;width:5px;height:105px;background:#4d8038;left:36px;top:55px;border-radius:9px}.date{letter-spacing:3px;text-transform:uppercase;font-size:12px;color:#927d22;opacity:0;animation:text .8s 2.7s forwards}h1{margin:10px 0 0;font-size:clamp(42px,10vw,72px);color:#d49d00;opacity:0;animation:text .9s 3s forwards}.subtitle{font-size:clamp(17px,4vw,21px);line-height:1.55;opacity:0;animation:text .9s 3.3s forwards}button{margin-top:12px;border:0;border-radius:99px;padding:13px 22px;background:#e3b600;color:white;font:15px Georgia;opacity:0;animation:text .8s 3.6s forwards}.hint{font-size:12px;color:#8b7a38;margin-top:10px;opacity:0;animation:text .8s 3.8s forwards}.petals{position:absolute;inset:0;pointer-events:none}.falling{position:absolute;top:-25px;width:12px;height:19px;background:#ffd83d;border-radius:70% 30%;animation:fall linear forwards}.ground{position:absolute;bottom:-110px;width:110%;height:180px;background:#8eb66b;border-radius:50% 50% 0 0;opacity:.5}
@keyframes card{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1}}@keyframes stem{from{opacity:0;transform:scaleY(0)}to{opacity:1}}@keyframes leaf{from{opacity:0;transform:scale(0)}to{opacity:1}}@keyframes tulip{0%{opacity:0;transform:translateX(-50%) scale(.2)}70%{opacity:1;transform:translateX(-50%) scale(1.08)}100%{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2deg}}@keyframes text{from{opacity:0;transform:translateY(10px)}to{opacity:1}}@keyframes glow{50%{transform:scale(1.08)}}@keyframes fall{to{transform:translate3d(var(--d),110vh,0) rotate(540deg)}}@media(max-width:500px){.garden{transform:scale(.86);margin-bottom:-20px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style></head><body><main class="scene"><div class="sun"></div><div class="petals" id="petals"></div><section class="card"><div class="garden"><div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div><div class="stem s4"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div><div class="flower f2"><div class="tulip"></div><div class="stemflower"></div></div><div class="flower f3"><div class="tulip"></div><div class="stemflower"></div></div><div class="flower f4"><div class="tulip"></div><div class="stemflower"></div></div><div class="flower f1"><div class="tulip"></div><div class="stemflower"></div></div></div><div class="date">Un pequeño detalle</div><h1>Para Andrea 🌼</h1><p class="subtitle">Un pequeño detalle de flores amarillas<br>para recordarte lo especial que eres. 💛</p><button id="more">Más flores amarillas 🌼</button><div class="hint">Toca el botón ✨</div></section><div class="ground"></div></main><script>
const box=document.getElementById("petals"),b=document.getElementById("more");function petal(){let p=document.createElement("i");p.className="falling";p.style.left=Math.random()*100+"vw";p.style.setProperty("--d",(Math.random()*180-90)+"px");p.style.animationDuration=5+Math.random()*5+"s";box.appendChild(p);setTimeout(()=>p.remove(),11000)}for(let i=0;i<18;i++)petal();b.onclick=()=>{for(let i=0;i<35;i++)petal();b.textContent="Para ti, Andrea 💛"};
</script></body></html>
